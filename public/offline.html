<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1217" />
  <title>Sin conexión - Finanzas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #ffffff; color: #0a1217; padding: 24px; text-align: center;
    }
    .offline-container { max-width: 320px; }
    .offline-icon { width: 80px; height: 80px; margin: 0 auto 24px; color: #85898b; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
    p { font-size: 16px; color: #85898b; line-height: 1.5; margin-bottom: 24px; }
    button { 
      background: #cdfe00; color: #0a1217; border: none; border-radius: 12px;
      padding: 14px 28px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #b8e600; }
  </style>
</head>
<body>
  <div class="offline-container">
    <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 3.18A21 21 0 0 1 12 2.15"/>
    </svg>
    <h1>Sin conexión</h1>
    <p>No hay internet disponible. Los datos guardados localmente siguen accesibles.</p>
    <button onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
